<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Alignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Box Alignment</h1>
    <p>Use the buttons to change the direction of the boxes.</p>

    <div class="buttons">
      <button id="horizontalButton">Horizontal</button>
      <button id="verticalButton">Vertical</button>
    </div>
  </header>

  <main class="box-container horizontal" id="boxContainer">
    <div class="box box-one">Box 1</div>
    <div class="box box-two">Box 2</div>
    <div class="box box-three">Box 3</div>
    <div class="box box-four">Box 4</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
